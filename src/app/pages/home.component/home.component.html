
<h1>Selecciona tu juego favorito</h1>
<div class="d-flex flex-wrap gap-3 justify-content-center">
    @for(card of menucards; track card.path){
        <div class="card">
            <h3>{{card.data.title}}</h3>
            <button class="secondary-button" [routerLink]="card.path">Jugar</button>
        </div>
    }
</div>
